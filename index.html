<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SunuCarbu — Stations-service Sénégal</title>
  <meta name="description" content="Carte des stations-service du Sénégal avec signalement de disponibilité.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root { --bg:#0f1714; --panel:#16211c; --line:#24352e; --text:#e8f2ec; --muted:#9bb5a8; --accent:#16834d; --danger:#c23b3b; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 14px; border-bottom:1px solid var(--line); background: var(--panel); }
    header h1 { margin:0; font-size:1.05rem; font-weight:700; }
    header .sub { color: var(--muted); font-size:0.8rem; }
    .layout { display:grid; grid-template-columns: 340px 1fr; height: calc(100vh - 52px); }
    aside { border-right:1px solid var(--line); background: var(--panel); overflow:auto; padding:12px; }
    #map { width:100%; height:100%; }
    .search { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:#0f1714; color:var(--text); margin-bottom:10px; }
    .actions { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
    button, .btn { border:0; border-radius:10px; padding:9px 12px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
    button.secondary { background:#24352e; color:var(--text); }
    button:disabled { opacity:0.5; cursor:not-allowed; }
    #brandGrid { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:10px 0 14px; }
    .bitem { display:flex; align-items:center; gap:8px; padding:8px; border-radius:10px; border:1px solid var(--line); background:#0f1714; color:var(--text); text-align:left; font-size:0.78rem; }
    .bitem.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .mini { width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:#fff; border:2px solid var(--c,#16834d); overflow:hidden; flex-shrink:0; }
    .mini img { width:16px; height:16px; object-fit:contain; }
    #list { display:flex; flex-direction:column; gap:6px; }
    .row { text-align:left; background:#0f1714; border:1px solid var(--line); border-radius:10px; padding:10px; color:var(--text); }
    .row.on { border-color: var(--accent); }
    .row strong { display:block; font-size:0.9rem; }
    .row span { color:var(--muted); font-size:0.78rem; }
    .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
    .dot.ok { background:#22c55e; } .dot.no { background:#ef4444; }
    .note { color:var(--muted); font-size:0.78rem; line-height:1.4; }
    #notice { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#102018; border:1px solid var(--line); padding:10px 14px; border-radius:12px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:9999; max-width:90vw; }
    #notice.on { opacity:1; }
    dialog, #dlg { position:fixed; inset:0; margin:auto; border:1px solid var(--line); border-radius:14px; background:var(--panel); color:var(--text); padding:16px; width:min(420px,92vw); z-index:10000; }
    #dlg[hidden] { display:none !important; }
    #dlg label { display:block; margin:8px 0 4px; font-size:0.85rem; color:var(--muted); }
    #dlg select { width:100%; padding:8px; border-radius:8px; border:1px solid var(--line); background:#0f1714; color:var(--text); }
    .dlg-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
    .marker-wrap { position:relative; width:30px; height:30px; }
    .marker-wrap .brand { width:28px; height:28px; border-radius:50%; background:#fff; border:2px solid var(--c,#16834d); display:flex; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(0,0,0,.35); overflow:hidden; }
    .marker-wrap .brand img { width:18px; height:18px; object-fit:contain; }
    .marker-wrap .sd { position:absolute; right:-1px; bottom:-1px; width:10px; height:10px; border-radius:50%; border:2px solid #fff; }
    .marker-wrap .sd.ok { background:#22c55e; } .marker-wrap .sd.no { background:#ef4444; }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 45% 55%; height: calc(100vh - 52px); }
      aside { border-right:0; border-top:1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>SunuCarbu <span id="count" class="sub"></span></h1>
      <div class="sub">Disponibilité des stations · signalements jusqu'à 19h (Dakar)</div>
    </div>
    <div class="actions">
      <button type="button" id="btnLocate" class="secondary">◎ Près de moi</button>
      <button type="button" id="btnReport" disabled>Signaler</button>
    </div>
  </header>
  <div class="layout">
    <aside>
      <input class="search" id="q" type="search" placeholder="Rechercher une station, ville, marque…" autocomplete="off">
      <div id="selInfo" class="note">Sélectionnez une station pour signaler.</div>
      <div id="brandGrid"></div>
      <div id="list"></div>
      <p id="sourceNote" class="note" style="margin-top:12px"></p>
    </aside>
    <div id="map"></div>
  </div>
  <div id="notice"></div>
  <div id="dlg" hidden>
    <h3 style="margin:0 0 8px">Signaler la disponibilité</h3>
    <p id="dlgDesc" class="note"></p>
    <label for="avail">État</label>
    <select id="avail">
      <option value="available">Disponible</option>
      <option value="shortage">En pénurie / rupture</option>
    </select>
    <label for="fuel">Carburant (optionnel)</label>
    <select id="fuel">
      <option value="">Non précisé</option>
      <option value="essence">Essence</option>
      <option value="gasoil">Gasoil</option>
      <option value="les-deux">Les deux</option>
    </select>
    <div class="dlg-actions">
      <button type="button" id="btnCancel" class="secondary">Annuler</button>
      <button type="button" id="btnSubmit">Envoyer</button>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="stations-shell.js"></script>
  <script src="stations-data.js"></script>
  <script src="stations-mka.js"></script>
  <script src="stations-ola.js"></script>
  <script src="stations-elton.js"></script>
  <script src="stations-star.js"></script>
  <script src="stations-api.js"></script>
  <script src="stations-touba-oil.js"></script>
  <script src="stations-marques-complementaires.js"></script>
  <script src="frontiere-senegal.js"></script>
  <script src="sunucarbu-app.js"></script>
</body>
</html>
